name: Real Kairo Living Flight Limb Visibility Review
on:
  pull_request:
    paths:
      - 'js/v100-pose-authority.js'
      - 'tools/capture-flight-video.cjs'
      - 'tests/v166-flight-body-expression.js'
      - '.github/workflows/kairo-living-flight-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compare-real-kairo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify opt-in and Kairo motion bounds
        run: |
          node tests/v166-flight-body-expression.js
          node tests/animation-ownership-contract.js
          node --check tools/capture-flight-video.cjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! node -e "const {chromium}=require('playwright');chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(()=>process.exit(1))"; then
            npx playwright install-deps chromium
          fi
      - name: Serve exact PR code and real Kairo VRM
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kairo-living-flight.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/assets/characters/kairo.vrm >/dev/null
      - name: Capture normal flight vs living-limb preview from three views
        env:
          VISUAL_CAPTURE_MODE: stills
          VISUAL_PREVIEWS: v156,v168
          VISUAL_LIVING_QA: '1'
          VISUAL_VIDEO_FPS: '24'
        run: node tools/capture-flight-video.cjs
      - name: Verify real WebGL expression and original baseline
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('visual-review-output/flight-stills')
          data=json.loads((p/'motion-metrics.json').read_text())
          captures={c['preview']:c for c in data['captures']}
          assert set(captures)=={'v156','v168'}
          for name,c in captures.items():
              assert c['info']['realVRM'] and c['info']['webgl']
              assert len(c['timeline'])==216 and len(c['files'])==27
              for view in ('front','side','back'):
                  assert (p/f'comparison-{view}.png').stat().st_size>10000
              for f in c['files']: assert (p/f).stat().st_size>2500
              flight=[r for r in c['timeline'] if r['pose']=='flight']
              assert flight
              if name=='v156':
                  assert all(r['flightBodyExpression']=='off' for r in flight)
              else:
                  active=[r for r in flight if r['flightBodyExpression']!='off']
                  assert len(active)>15,'opt-in body expression never reaches visible VRM'
                  assert max(r['flightBodyDegrees'] for r in active)>4.0
                  assert all(0<=r['flightBodyDegrees']<5.6 for r in active)
                  import math
                  def angle(a,b):
                      dot=min(1,abs(sum(x*y for x,y in zip(a,b))))
                      return 2*math.acos(dot)
                  hover=[r for r in active if r['stage']=='hover']
                  assert len(hover)>140,'must inspect continuous flight flow'
                  def peak_movement(joint):
                      return max(angle(a[joint],b[joint])
                          for a in hover[::20] for b in hover[::20])
                  assert .004<peak_movement('chestQ')<.04, \
                      'torso should flow gently, not lock rigid or bow'
                  assert peak_movement('leftUpperArmQ')>.03
                  assert peak_movement('rightUpperArmQ')>.025
                  # Movement on BOTH arms should have different rhythms.
                  # Do not require one arm to freeze while the other acts.
                  def velocity_series(joint):
                      return [angle(a[joint],b[joint])
                          for a,b in zip(hover,hover[1:])]
                  l,r=velocity_series('leftUpperArmQ'),velocity_series('rightUpperArmQ')
                  assert any(x>.00001 for x in l) and any(x>.00001 for x in r)
                  assert max(abs(a-b) for a,b in zip(l,r))>.0003, \
                      'both arms have identical step timing'
          print('PASS real Kairo continuous staggered arm/body flow over nine seconds; original Q remains default')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-natural-limbs-3-view
          path: visual-review-output/flight-stills/
          retention-days: 14
          if-no-files-found: warn
