name: Kairo V87 Side Kick - Isolated Full Body Native Candidate
on:
  push:
    branches: [feature/kairo-authentic-karate-kicks]
    paths:
      - 'tools/author-kairo-side-kick-from-v87.cjs'
      - '.github/workflows/kairo-v87-side-kick-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-body-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Kairo browser and video tools
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node --check tools/author-kairo-side-kick-from-v87.cjs
          node --check tools/verify-kairo-storm-fist.cjs
      - name: Build isolated game locally (never publish)
        run: python3 tools/build.py
      - name: Start local game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v87-native-candidate.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Sample professional full-body Side Kick on actual Kairo
        run: node tools/author-kairo-side-kick-from-v87.cjs
      - name: Swap unapproved candidate into temporary runner checkout only
        run: |
          set -euo pipefail
          cp visual-review-output/kairo-v87-side-kick-candidate/storm-fist-v3-side-kick-review-only.json assets/animations/kairo/storm-fist.v3.json
          NATIVE_COMBAT_SET=assets/animations/kairo/storm-fist.v3.json node tests/native-combat-set.js
          node tools/verify-kairo-arm-clearance.cjs --pack assets/animations/kairo/storm-fist.v3.json --anchor assets/animations/reference/kairo-combat-anchor.v1.json
      - name: Record isolated candidate on real Kairo front and side
        env:
          STORM_QA_COMBAT_FLAG: storm-fist-v3
          STORM_QA_VISUAL_ONLY: '1'
          STORM_QA_SKIP_SEQUENCE: '1'
          STORM_QA_SKIP_MOVES: '0'
          STORM_QA_MOVES: side-kick
          STORM_QA_VIDEO_FPS: '30'
          STORM_QA_CONTINUOUS_MOVES: '1'
          STORM_QA_HIDE_OPPONENT: '1'
          STORM_QA_OUTPUT: visual-review-output/kairo-v87-side-kick-candidate/real-kairo-capture
        run: node tools/verify-kairo-storm-fist.cjs
      - name: Verify ONLY side kick changed and commit isolated improvement on draft branch
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert/strict');
          const file='assets/animations/kairo/storm-fist.v3.json';
          const original=JSON.parse(cp.execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'}));
          const candidate=JSON.parse(fs.readFileSync(file,'utf8'));
          const meta=x=>Object.fromEntries(Object.entries(x).filter(([k])=>k!=='clips'));
          assert.deepEqual(meta(candidate),meta(original),'Native-pack metadata changed');
          assert.equal(candidate.clips.length,19,'Lost a native clip');
          const before=Object.fromEntries(original.clips.map(c=>[c.clipId,c]));
          const after=Object.fromEntries(candidate.clips.map(c=>[c.clipId,c]));
          assert.deepEqual(Object.keys(after).sort(),Object.keys(before).sort(),'Clip identity changed');
          for(const id of Object.keys(before)){
            if(id==='side-kick')continue;
            assert.deepEqual(after[id],before[id],'Unexpectedly modified native clip '+id);
          }
          assert.notDeepEqual(after['side-kick'],before['side-kick'],'Mixamo change is empty');
          console.log('PASS exactly one experimental clip updated: side-kick; 18 clips preserved');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animations/kairo/storm-fist.v3.json
          git commit -m "art(kairo): use original Mixamo full-body Side Kick (experimental draft only)"
          git fetch origin feature/kairo-authentic-karate-kicks
          git rebase origin/feature/kairo-authentic-karate-kicks
          git push origin HEAD:feature/kairo-authentic-karate-kicks
      - name: Upload candidate and review footage (never deploy)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-v87-side-kick-native-unapproved-review
          path: visual-review-output/kairo-v87-side-kick-candidate/
          retention-days: 21
          if-no-files-found: warn
