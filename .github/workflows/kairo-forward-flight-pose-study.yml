name: Kairo Real-VRM Head and Forward Flight Pose Study
on:
  pull_request:
    paths:
      - 'js/kairo-pose-lab.js'
      - 'tools/author-kairo-forward-flight-stills.cjs'
      - '.github/workflows/kairo-forward-flight-pose-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-real-kairo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real VRM WebGL viewer
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check js/kairo-pose-lab.js
          node --check tools/author-kairo-forward-flight-stills.cjs
      - name: Serve the unchanged Sky Clash model and Pose Lab
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/kairo-flight-study.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/pose-lab.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/assets/animations/reference/kairo-v152-hover.pose.json >/dev/null
      - name: Generate 4 exact skeleton keyframe candidates and 3-view evidence
        run: node tools/author-kairo-forward-flight-stills.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-head-and-forward-flight-studies
          path: visual-review-output/kairo-real-flight-candidates/
          retention-days: 21
