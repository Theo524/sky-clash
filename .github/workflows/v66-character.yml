name: V66 VRM Character Integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'js/v66-*'
      - 'js/v67-*'
      - 'js/v68-*'
      - 'js/v69-*'
      - 'js/v70-*'
      - 'js/v71-*'
      - 'js/v72-*'
      - 'assets/animations/gameplay/**'
      - 'tests/v71-*.js'
      - 'tests/v72-*.js'
      - 'tests/v73-*.js'
      - 'tests/v74-*.js'
      - 'tests/v75-*.js'
      - 'tests/v76-*.js'
      - 'tests/v77-*.js'
      - 'tests/v78-*.js'
      - 'tests/v79-*.js'
      - 'tests/v80-*.js'
      - 'tests/v81-*.js'
      - 'tests/v82-*.js'
      - 'tests/v87-*.js'
      - 'tests/v89-*.js'
      - 'tests/v90-*.js'
      - 'tests/v91-*.js'
      - 'tests/v92-*.js'
      - 'tests/v94-*.js'
      - 'js/v81-*'
      - 'js/v79-*'
      - 'js/v78-*'
      - 'js/v76-*'
      - 'js/character-motion-preview.js'
      - 'js/animation-studio.js'
      - 'js/v62-playable-master.js'
      - 'index.html'
      - 'animation-studio.html'
      - 'tests/v66-*.js'
      - 'tests/v68-*.js'
      - 'tests/v69-*.js'
      - 'tests/v70-*.js'
      - '.github/workflows/v66-character.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'js/v66-*'
      - 'js/v67-*'
      - 'js/v68-*'
      - 'js/v69-*'
      - 'js/v70-*'
      - 'js/v71-*'
      - 'js/v72-*'
      - 'assets/animations/gameplay/**'
      - 'tests/v71-*.js'
      - 'tests/v72-*.js'
      - 'tests/v73-*.js'
      - 'tests/v74-*.js'
      - 'tests/v75-*.js'
      - 'tests/v76-*.js'
      - 'tests/v77-*.js'
      - 'tests/v78-*.js'
      - 'tests/v79-*.js'
      - 'tests/v80-*.js'
      - 'tests/v81-*.js'
      - 'tests/v82-*.js'
      - 'tests/v87-*.js'
      - 'tests/v89-*.js'
      - 'tests/v90-*.js'
      - 'tests/v91-*.js'
      - 'tests/v92-*.js'
      - 'tests/v94-*.js'
      - 'js/v81-*'
      - 'js/v79-*'
      - 'js/v78-*'
      - 'js/v76-*'
      - 'js/character-motion-preview.js'
      - 'js/animation-studio.js'
      - 'js/v62-playable-master.js'
      - 'index.html'
      - 'animation-studio.html'
      - 'tests/v66-*.js'
      - 'tests/v68-*.js'
      - 'tests/v69-*.js'
      - 'tests/v70-*.js'
      - '.github/workflows/v66-character.yml'
permissions:
  contents: write
jobs:
  character-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build.py
      - run: node --check js/game.js
      - run: node --check js/v66-character-source.js
      - run: node --check js/v66-game-boot.js
      - run: node --check js/v67-vrm0-hands.js
      - run: node --check js/v68-humanoid-retarget.js
      - run: node --check js/v69-motion-library.js
      - run: node --check js/v70-fbx-repair.js
      - run: node --check js/v71-mixamo-gameplay.js
      - run: node --check js/v72-walk-arms.js
      - run: node --check js/v72-studio-game-export.js
      - run: node --check js/v72-published-actions.js
      - run: node --check js/v78-studio-hip-bounce.js
      - run: node --check js/v79-pack-catalog.js
      - run: node --check js/v79-gif-preview.js
      - run: node --check js/v79-extra-actions.js
      - run: node --check js/v81-pose-transitions.js
      - run: node --check js/v89-grounded-step.js
      - run: node --check js/v91-stance-continuity.js
      - run: node --check js/v76-upper-body.js
      - run: node --check js/animation-studio.js
      - run: node --check js/character-motion-preview.js
      - run: node --check js/v62-playable-master.js
      - run: node tests/v60-master-base.js
      - run: node tests/v64-arm-clearance.js
      - run: node tests/v65-anime-fighter.js
      - run: node tests/v66-character-source.js
      - run: node tests/v67-vrm0-hands.js
      - run: node tests/v68-humanoid-retarget.js
      - run: node tests/v69-motion-library.js
      - run: node tests/v70-fbx-repair.js
      - run: node tests/v71-permanent-game-walk.js
      - run: node tests/v72-studio-publishing.js
      - run: node tests/v73-native-kairo-hands.js
      - run: node tests/v74-grounded-walk.js
      - run: node tests/v75-lowered-walk-arms.js
      - run: node tests/v76-upper-body-ownership.js
      - run: node tests/v77-published-idle.js
      - run: node tests/v78-hip-bounce-and-idle-handoff.js
      - run: node tests/v79-catalog-and-actions.js
      - run: node tests/v80-analog-locomotion.js
      - run: node tests/v81-state-ownership.js
      - run: node tests/v82-studio-jump-and-locomotion.js
      - run: node tests/v86-ue5-mixamo-export.js
      - run: node tests/v87-recorded-combat.js
      - run: node tests/v88-walk-preview.js
      - run: node tests/v89-first-step.js
      - run: node tests/v90-idle-stance-match.js
      - run: node tests/v91-pose-frame-continuity.js
      - run: node tests/v92-unified-idle-arms.js
      - run: node tests/v94-pose-handoff-quaternion.js
      - name: Publish rebuilt game bundle
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- js/game.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/game.js
            git commit -m 'Build V66 game bundle from source'
            git push
          fi
