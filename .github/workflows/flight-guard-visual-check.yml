name: Quick Real Kairo Relaxed Hover Pose Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/v100-pose-authority.js'
      - 'js/v66-game-boot.js'
      - 'js/v142-hover-keyframes.js'
      - 'js/v143-hover-performance.js'
      - 'js/v144-relaxed-arms.js'
      - 'js/v145-vertical-flight.js'
      - 'js/v146-vertical-followthrough.js'
      - 'js/v147-horizontal-flight.js'
      - 'js/v148-full-flight.js'
      - 'js/v149-travel-performance.js'
      - 'js/v150-joystick-flight.js'
      - 'js/v151-travel-arms.js'
      - 'js/v152-flight-silhouette.js'
      - 'js/v153-streamlined-flight.js'
      - 'tools/capture-flight-guard-stills.cjs'
      - '.github/workflows/flight-guard-visual-check.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare real Kairo browser and encoder
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          node --check tools/capture-flight-guard-stills.cjs
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Serve built playable Sky Clash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/kairo-guard-server.log 2>&1 &
          for i in $(seq 1 16); do
            if curl --max-time 3 --fail -sSf http://127.0.0.1:8765/index.html >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl --fail -sSf http://127.0.0.1:8765/index.html >/dev/null || {
            cat /tmp/kairo-guard-server.log
            exit 1
          }
      - name: Capture Kairo normal V152 hover vs full-body V153 forward-lean flight
        env:
          VISUAL_PORT: '8765'
          VISUAL_PREVIEWS: 'v152,v153'
          VISUAL_VIDEO_FPS: '24'
        run: node tools/capture-flight-guard-stills.cjs
      - name: Check actual VRM actor, hand directions and video frames
        run: |
          python - <<'PY'
          import pathlib,json,subprocess
          p=pathlib.Path('visual-review-output/flight-guard-stills')
          report=json.loads((p/'motion-metrics.json').read_text())
          assert len(report['captures'])==2
          for capture in report['captures']:
              assert capture['info']['realVRM'] and capture['info']['webgl']
              assert len(capture['timeline'])==13
              assert all(t['pose']=='flight' for t in capture['timeline'])
              for view in ('front','side','back'):
                  f=p/f"{capture['preview']}-{view}.mp4"
                  assert f.stat().st_size>8000
                  d=json.loads(subprocess.check_output(['ffprobe','-v','error',
                      '-select_streams','v:0','-show_entries','stream=nb_frames',
                      '-of','json',str(f)]))['streams'][0]
                  assert int(d['nb_frames'])==13
              if capture['preview']=='v149':
                  assert all(t['flightAuthoredClip']=='V149 expressive moving flight legs'
                    and 2<t['leftAuthored']['handAheadCm']<25
                    and 2<t['rightAuthored']['handAheadCm']<25
                   and t['leftAuthored']['handAboveElbowCm']< -12
                   and t['rightAuthored']['handAboveElbowCm']< -12
                   for t in capture['timeline'])
                  states={t['stage']:t for t in capture['timeline']}
                  assert states['cruise']['horizontalPoseMode']=='forward'
                  assert states['diagonal']['horizontalPoseMode'] in ('forward','sideways')
                  assert states['strafe-left']['horizontalPoseSide']<-.3
                  assert states['strafe-right']['horizontalPoseSide']>.3
                  assert states['fast']['horizontalPoseFast']>.75
                  assert abs(states['turn-left']['horizontalPoseTurn'])>.1
                  assert abs(states['turn-right']['horizontalPoseTurn'])>.1
                  assert states['backward']['horizontalPoseMode']=='backward'
                  assert states['hover']['horizontalPoseMode']=='hover'
                  assert states['cruise']['signedForward']>5
                  assert states['backward']['signedForward']< -5
                  assert states['ascend']['verticalPoseMode']=='ascending'
                  assert states['descend']['verticalPoseMode']=='descending'
                  assert states['hover']['verticalPoseMode']=='hover'
                  assert states['ascend']['verticalPoseWeight']>.65
                  assert states['descend']['verticalPoseWeight']>.65
                  assert states['hover']['verticalPoseWeight']<.01
                  assert states['ascend']['leftKneeForwardCm'] != states['descend']['leftKneeForwardCm']
              if capture['preview']=='v150':
                  states={t['stage']:t for t in capture['timeline']}
                  assert all(t['flightAuthoredClip']=='V150 joystick-responsive flight'
                    for t in capture['timeline'])
                  assert states['hover']['horizontalPoseMode']=='hover'
                  assert states['hover']['inputStrength']<.01
                  assert states['cruise']['inputForward']>.8
                  assert states['cruise']['inputStrength']>.8
                  assert states['backward']['lockedRetreat'] is True
                  assert states['backward']['horizontalPoseMode']=='backward'
                  assert states['backward']['signedForward']< -5
                  assert states['ascend']['verticalPoseMode']=='ascending'
                  assert states['descend']['verticalPoseMode']=='descending'
              if capture['preview']=='v151':
                  states={t['stage']:t for t in capture['timeline']}
                  assert all(t['flightAuthoredClip']=='V151 relaxed authored travel arms'
                    for t in capture['timeline'])
                  assert states['cruise']['travelArmBlend']>.85
                  assert states['cruise']['travelHandBlend']>.75
                  assert states['cruise']['travelArmMode']=='relaxed-forward'
                  assert states['hover']['travelArmBlend']<.05
                  assert states['backward']['lockedRetreat'] is True
                  assert states['backward']['travelArmBlend']<.05
                  assert states['strafe-left']['travelArmBlend']<.05
                  assert states['strafe-right']['travelArmBlend']<.05
                  assert states['fast']['travelArmBlend']>.75
                  assert states['cruise']['leftAuthored']['handAboveElbowCm'] < -5
                  assert states['cruise']['rightAuthored']['handAboveElbowCm'] < -5
              if capture['preview']=='v152':
                  states={t['stage']:t for t in capture['timeline']}
                  assert all(t['flightAuthoredClip']=='V152 calm hover and trailing arms'
                    for t in capture['timeline'])
                  assert states['cruise']['trailingElbow']>.80
                  assert states['cruise']['trailingHand']>.75
                  assert states['cruise']['trailingPose']=='travel-arms-back'
                  assert states['cruise']['quietHover']<.10
                  assert states['hover']['quietHover']>.75
                  assert states['backward']['lockedRetreat'] is True
                  assert states['backward']['trailingElbow']<.05
                  assert states['strafe-left']['trailingElbow']<.05
                  assert states['strafe-right']['trailingHand']<.05
                  assert states['fast']['trailingElbow']>.75
                  assert states['cruise']['leftAuthored']['elbowAheadCm'] < 0
                  assert states['cruise']['rightAuthored']['elbowAheadCm'] < 0
                  assert states['cruise']['leftAuthored']['handAheadCm'] < 2
                  assert states['cruise']['rightAuthored']['handAheadCm'] < 2
              if capture['preview']=='v153':
                  states={t['stage']:t for t in capture['timeline']}
                  assert all(t['flightAuthoredClip']=='V153 whole-body forward flight'
                    for t in capture['timeline'])
                  assert states['cruise']['streamlineDegrees']>53
                  assert states['cruise']['streamlineWeight']>.85
                  assert states['hover']['streamlineDegrees']<1
                  assert states['backward']['streamlineDegrees']<2
                  assert states['strafe-left']['streamlineDegrees']<2
                  assert states['cruise']['flightPelvisBalanceWorld']['pelvisNeckForwardCm']>58
                  assert states['cruise']['flightTorsoWorld']['pitchedForwardCm']>50
                  assert states['cruise']['leftAuthored']['handAheadCm']<3
                  assert states['cruise']['rightAuthored']['handAheadCm']<3
              assert set(t['stage'] for t in capture['timeline']) >= {'hover','cruise','backward','strafe-left','strafe-right'}
          print('PASS real Kairo V152 vs V153 full-body pitch, trailing shins and unchanged hover/lock-on')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-v153-full-body-forward-review
          path: visual-review-output/flight-guard-stills/
          retention-days: 14
          if-no-files-found: warn
