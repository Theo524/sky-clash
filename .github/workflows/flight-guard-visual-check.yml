name: Quick Real Kairo Relaxed Hover Pose Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/v100-pose-authority.js'
      - 'js/v66-game-boot.js'
      - 'js/v142-hover-keyframes.js'
      - 'js/v143-hover-performance.js'
      - 'js/v144-relaxed-arms.js'
      - 'js/v145-vertical-flight.js'
      - 'js/v146-vertical-followthrough.js'
      - 'tools/capture-flight-guard-stills.cjs'
      - '.github/workflows/flight-guard-visual-check.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare real Kairo browser and encoder
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          node --check tools/capture-flight-guard-stills.cjs
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Serve built playable Sky Clash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/kairo-guard-server.log 2>&1 &
          for i in $(seq 1 16); do
            if curl --max-time 3 --fail -sSf http://127.0.0.1:8765/index.html >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl --fail -sSf http://127.0.0.1:8765/index.html >/dev/null || {
            cat /tmp/kairo-guard-server.log
            exit 1
          }
      - name: Capture real Kairo hover, travel and vertical changes V145 vs V146
        env:
          VISUAL_PORT: '8765'
          VISUAL_PREVIEWS: 'v145,v146'
          VISUAL_VIDEO_FPS: '24'
        run: node tools/capture-flight-guard-stills.cjs
      - name: Check actual VRM actor, hand directions and video frames
        run: |
          python - <<'PY'
          import pathlib,json,subprocess
          p=pathlib.Path('visual-review-output/flight-guard-stills')
          report=json.loads((p/'motion-metrics.json').read_text())
          assert len(report['captures'])==2
          for capture in report['captures']:
              assert capture['info']['realVRM'] and capture['info']['webgl']
              assert len(capture['timeline'])==8
              assert all(t['pose']=='flight' for t in capture['timeline'])
              for view in ('front','side','back'):
                  f=p/f"{capture['preview']}-{view}.mp4"
                  assert f.stat().st_size>8000
                  d=json.loads(subprocess.check_output(['ffprobe','-v','error',
                      '-select_streams','v:0','-show_entries','stream=nb_frames',
                      '-of','json',str(f)]))['streams'][0]
                  assert int(d['nb_frames'])==8
              if capture['preview']=='v146':
                  assert all(t['flightAuthoredClip']=='V146 expressive ascent/descent follow-through'
                    and 2<t['leftAuthored']['handAheadCm']<25
                    and 2<t['rightAuthored']['handAheadCm']<25
                   and t['leftAuthored']['handAboveElbowCm']< -12
                   and t['rightAuthored']['handAboveElbowCm']< -12
                   for t in capture['timeline'])
                  states={t['stage']:t for t in capture['timeline']}
                  assert states['ascend']['verticalPoseMode']=='ascending'
                  assert states['descend']['verticalPoseMode']=='descending'
                  assert states['hover']['verticalPoseMode']=='hover'
                  assert states['ascend']['verticalPoseWeight']>.65
                  assert states['descend']['verticalPoseWeight']>.65
                  assert states['hover']['verticalPoseWeight']<.01
                  assert states['ascend']['leftKneeForwardCm'] != states['descend']['leftKneeForwardCm']
          print('PASS actual Kairo V145 vs V146 natural levitation gallery')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-v146-vertical-followthrough-review
          path: visual-review-output/flight-guard-stills/
          retention-days: 14
          if-no-files-found: warn
