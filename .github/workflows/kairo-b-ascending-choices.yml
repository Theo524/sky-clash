name: Kairo B Base Ascend Motion Choices
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'tools/preview-kairo-b-ascending-choices.cjs'
      - 'tools/compose-kairo-b-ascending-choices.py'
      - '.github/workflows/kairo-b-ascending-choices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-kairo-b-ascend-choices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Install Kairo Pose Lab browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! node -e "const {chromium}=require('playwright');chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(()=>process.exit(1))"; then
            npx playwright install-deps chromium
          fi
          python -m pip install pillow==11.3.0
          node --check tools/preview-kairo-b-ascending-choices.cjs
      - name: Serve real Kairo VRM0 and Pose Lab
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/kairo-b-ascend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/pose-lab.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/assets/characters/kairo.vrm >/dev/null
      - name: Author and render B ascending options on real Kairo
        env:
          VISUAL_PORT: '8765'
        run: node tools/preview-kairo-b-ascending-choices.cjs
      - name: Compose animated visual picker
        run: python tools/compose-kairo-b-ascending-choices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-b-ascending-motion-choice
          path: visual-review-output/kairo-b-ascending-choices/
          retention-days: 21
