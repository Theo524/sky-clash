name: Validate Permanent Kairo V164 Source Clips
on:
  pull_request:
    paths:
      - 'assets/animations/kairo/selected/v164/**'
      - 'js/v164-selected-kairo-real-flight.js'
      - 'tools/build-kairo-v164-selected-flight.cjs'
      - '.github/workflows/kairo-v164-generate-selected-clips.yml'
permissions:
  contents: read
jobs:
  verify-selected-vrm0-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Kairo original selected quaternions against shipped V164
        run: node tests/v164-selected-kairo-real-flight.js
      - name: Confirm sources can recreate the module without old Actions ZIPs
        run: |
          node tools/build-kairo-v164-selected-flight.cjs
          node --check js/v164-selected-kairo-real-flight.js
          node tests/v164-selected-kairo-real-flight.js
