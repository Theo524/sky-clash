name: Real Kairo Jump Visual Captures

# Cancel superseded PR workflows without ever hiding main-branch failures.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
    inputs:
      previews:
        description: "Comma-separated, version-specific jump previews"
        required: false
        default: "v124,v125"
permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Reuse only the exact Playwright Chromium build; install-deps
      # still verifies runtime system libraries for the runner.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local published game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/sky-visual-server.log 2>&1 &
          echo $! > /tmp/sky-visual-server.pid
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html > /dev/null
      - name: Capture ACTUAL VRM from front and side during idle, crouch and ascent
        env:
          VISUAL_PORT: '8765'
          VISUAL_PREVIEWS: ${{ inputs.previews || 'v124,v125' }}
        run: node tools/capture-jump-frames.cjs
      - name: Install and strictly verify offline MP4 encoder
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version > /tmp/sky-clash-ffmpeg-version.txt
          sed -n '1p' /tmp/sky-clash-ffmpeg-version.txt
          ffmpeg -hide_banner -encoders > /tmp/sky-clash-video-encoders.txt
          grep 'libx264' /tmp/sky-clash-video-encoders.txt
          node --check tools/capture-jump-video.cjs
      - name: Record deterministic full-motion Kairo front/side MP4 comparisons
        env:
          VISUAL_PORT: '8765'
          VISUAL_PREVIEWS: ${{ inputs.previews || 'v124,v125' }}
          VISUAL_VIDEO_FPS: '24'
        run: node tools/capture-jump-video.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-jump-frames
          path: |
            visual-review-output/*.png
            visual-review-output/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-jump-videos
          path: visual-review-output/videos/
          if-no-files-found: warn
          retention-days: 14
