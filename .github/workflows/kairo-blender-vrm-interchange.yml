name: Kairo Blender to VRM0 Rig Interchange — Offline Proof

on:
  pull_request:
    paths:
      - 'tools/author-kairo-blender-probe.py'
      - 'tools/verify-kairo-blender-probe.cjs'
      - 'tools/author-kairo-connected-joints.py'
      - 'tools/verify-kairo-connected-joints.cjs'
      - 'tools/author-kairo-foot-ik.py'
      - 'tools/verify-kairo-foot-ik.cjs'
      - '.github/workflows/kairo-blender-vrm-interchange.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-rig-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare official standalone Blender 4.5 LTS (no apt)
        run: |
          set -euo pipefail
          version=4.5.15
          filename="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.5"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 540 \
            "$base/$filename" --output "$filename"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
            "$base/blender-${version}.sha256" --output "blender-${version}.sha256"
          grep " $filename" "blender-${version}.sha256" | sha256sum --check --
          tar -xJf "$filename"
          binary="$RUNNER_TEMP/blender-${version}-linux-x64/blender"
          test -x "$binary"
          echo "$RUNNER_TEMP/blender-${version}-linux-x64" >> "$GITHUB_PATH"
          "$binary" --version | head -3
          "$binary" --background --factory-startup --python-expr 'import numpy; print("KAIRO_BLENDER_NUMPY_READY", numpy.__version__)'
      - name: Author one test-only armature movement on the actual Kairo VRM
        run: |
          blender --background --factory-startup --python tools/author-kairo-blender-probe.py
          test -s visual-review-output/kairo-combat-foundation/blender-original-rig-probe.json
      - name: Author two isolated test-only 20-joint source profiles
        run: |
          blender --background --factory-startup --python tools/author-kairo-connected-joints.py
          test -s visual-review-output/kairo-combat-foundation/blender-connected-joints-source.json
      - name: Author offline Blender foot-target IK samples on Kairo real VRM0
        run: |
          blender --background --factory-startup --python tools/author-kairo-foot-ik.py
          test -s visual-review-output/kairo-combat-foundation/blender-foot-ik-source.json
      - name: Install real WebGL browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! node -e "const {chromium}=require('playwright');chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(()=>process.exit(1))"; then
            npx playwright install-deps chromium
          fi
          node --check tools/verify-kairo-blender-probe.cjs
          node --check tools/verify-kairo-connected-joints.cjs
          node --check tools/verify-kairo-foot-ik.cjs
      - name: Start immutable game checkout for real Kairo SDK proof
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/kairo-blender-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --max-time 3 -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
      - name: Transfer Blender evaluated world delta onto real Kairo normalized VRM
        env: {VISUAL_PORT: '8765'}
        run: node tools/verify-kairo-blender-probe.cjs
      - name: Verify connected Blender joint transfer and measure shoe drift
        env: {VISUAL_PORT: '8765'}
        run: node tools/verify-kairo-connected-joints.cjs
      - name: Measure whether Blender IK foot locks survive real Kairo retarget
        env: {VISUAL_PORT: '8765'}
        run: node tools/verify-kairo-foot-ik.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-blender-real-vrm-interchange-proof
          path: visual-review-output/kairo-combat-foundation/blender*
          retention-days: 21
