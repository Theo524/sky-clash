name: V71 Air Base — Real Kairo A/B Comparison
on:
  pull_request:
    paths:
      - 'tools/compare-v71-air-base.cjs'
      - '.github/workflows/v71-air-base-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compare-kairo-real-vrm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Check source and prevent broad visual CI
        run: |
          node --check tools/compare-v71-air-base.cjs
          node tests/ci-workflow-trigger-safety.js
          node tests/animation-ownership-contract.js
      - name: Install Chromium / software WebGL
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! node -e "const {chromium}=require('playwright');chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(()=>process.exit(1))"; then
            npx playwright install-deps chromium
          fi
      - name: Serve exact unchanged playable checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v71-ab-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/assets/characters/kairo.vrm >/dev/null
      - name: Compare original versus browser-only early yield at 30/60/120 FPS
        run: node tools/compare-v71-air-base.cjs
      - name: Preserve real-VRM per-frame poses and measured differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v71-air-base-real-vrm-ab
          path: visual-review-output/v71-air-base-ab/
          retention-days: 21
          if-no-files-found: warn
