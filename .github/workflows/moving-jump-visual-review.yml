name: Moving Jump Visual Review

# Cancel superseded PR workflows without ever hiding main-branch failures.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_dispatch:
    inputs:
      previews:
        description: "One or two jump previews for side-by-side comparison"
        required: false
        default: "v120"
  pull_request:
    paths:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        motion: [walking, running]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Reuse only the exact Playwright Chromium build; install-deps
      # still verifies runtime system libraries for the runner.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Install Chromium and ffmpeg
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          node --check tools/capture-jump-video.cjs
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Serve the unchanged game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/sky-moving-review-server.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html > /dev/null
      - name: Capture Kairo ${{ matrix.motion }} takeoff, full rise, fall and moving contact
        env:
          VISUAL_PORT: '8765'
          VISUAL_PREVIEWS: ${{ inputs.previews || 'v120' }}
          VISUAL_VIDEO_FPS: '24'
          VISUAL_JUMP_MOTION: ${{ matrix.motion }}
        run: node tools/capture-jump-video.cjs
      - name: Verify non-empty 24fps real-VRM MP4s and moving gait telemetry
        env:
          MOTION: ${{ matrix.motion }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          p=pathlib.Path('visual-review-output/videos')/os.environ['MOTION']
          report=json.loads((p/'motion-metrics.json').read_text())
          assert report['motion']==os.environ['MOTION']
          assert report['horizontalSpeed']>1.3
          for c in report['captures']:
              assert c['frames']==48 and c['frameRate']==24
              names={x['pose'] for x in c['timeline']}
              assert {'prep','jump','fall','landing'}<=names
              assert any((x.get('movingJumpWeight') or 0)>.05 for x in c['timeline'])
              assert any(x.get('landingFlow')=='MOVING FLOW' for x in c['timeline'])
              for view in ['front','side']:
                  video=p/f"{c['preview']}-{view}.mp4"
                  assert video.stat().st_size>10000,video
                  probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate,nb_frames','-of','json',str(video)]))
                  stream=probe['streams'][0]
                  assert stream['r_frame_rate']=='24/1' and int(stream['nb_frames'])==48,stream
          print('PASS: actual moving VRM, V103 stride, V109 flow and real 24fps front/side videos')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-${{ matrix.motion }}-jump-videos
          path: visual-review-output/videos/${{ matrix.motion }}/
          if-no-files-found: warn
          retention-days: 14
