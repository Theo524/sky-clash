name: Kairo Batch A Real-VRM Combat Authoring

# One evidence-producing authoring pass for the batch; no changes to game on default.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'tools/author-kairo-combat-choreography.cjs'
      - '.github/workflows/kairo-combat-batch-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat-pose-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Setup headless real-Kairo WebGL
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check tools/author-kairo-combat-choreography.cjs
      - name: Serve actual VRM and Pose Lab
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/combat-a-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --max-time 3 -fsS http://127.0.0.1:8765/pose-lab.html >/dev/null; then break; fi
            sleep 1
          done
      - name: Bake and verify real-VRM original Storm Fist keyframes
        env:
          VISUAL_PORT: '8765'
        run: node tools/author-kairo-combat-choreography.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-original-combat-batch-a
          path: visual-review-output/kairo-combat-batch-a/
          retention-days: 14
