name: Animation Ownership Contract

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/PROJECT-CONTEXT.md'
      - 'docs/ANIMATION-OWNERSHIP-CONTRACT.md'
      - 'docs/KAIRO-RIG-CONTRACT.v1.json'
      - 'js/**'
      - 'assets/characters/**'
      - 'assets/rin.vrm'
      - 'assets/animations/gameplay/**'
      - 'tests/**'
      - 'tools/build.py'
      - 'index.html'
      - 'animation-studio.html'
      - 'src/**'
      - 'tests/animation-ownership-contract.js'
      - 'tests/v100-single-pose-authority.js'
      - 'tests/v115-forward-knee-calibration.js'
      - '.github/workflows/animation-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/PROJECT-CONTEXT.md'
      - 'docs/ANIMATION-OWNERSHIP-CONTRACT.md'
      - 'docs/KAIRO-RIG-CONTRACT.v1.json'
      - 'js/**'
      - 'assets/characters/**'
      - 'assets/rin.vrm'
      - 'assets/animations/gameplay/**'
      - 'tests/**'
      - 'tools/build.py'
      - 'index.html'
      - 'animation-studio.html'
      - 'src/**'
      - 'tests/animation-ownership-contract.js'
      - 'tests/v100-single-pose-authority.js'
      - 'tests/v115-forward-knee-calibration.js'
      - '.github/workflows/animation-ownership.yml'

permissions:
  contents: read

jobs:
  ownership-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated game bundle matches editable source
        run: |
          python tools/build.py
          git diff --exit-code -- js/game.js
      - name: Check V142 authored full-body hover interpolation
        run: node tests/v142-keyframed-hover.js
      - name: Check V143 living hover animation ownership and transitions
        run: node tests/v143-living-hover.js
      - name: Check V144 natural arms without changes to approved body or jump
        run: node tests/v144-relaxed-arms.js
      - name: Check V145 vertical flight without physics/jump ownership changes
        run: node tests/v145-vertical-flight.js
      - name: Check V146 smooth expressive vertical motion with approved neutral preserved
        run: node tests/v146-vertical-followthrough.js
      - name: Check V147 forward/backward authored flight and existing motion safety
        run: node tests/v147-horizontal-flight.js
      - name: Verify V148 omnidirectional flight, transitions, and unchanged approved animation
        run: node tests/v148-full-flight.js
      - name: Verify V149 living whole-body travel never breaks approved hover or jump
        run: node tests/v149-living-travel.js
      - name: Re-run all 70 existing V66 source and animation checks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const workflow = fs.readFileSync('.github/workflows/v66-character.yml','utf8');
          const commands = [...workflow.matchAll(/^\s+- run: (node [^\r\n]+)$/gm)]
            .map(m => m[1].trim());
          if(commands.length < 70)
            throw new Error('Legacy regression suite unexpectedly lost commands: '+commands.length);
          for (const command of commands) {
            const parts = command.split(/\s+/);
            if (parts[0] !== 'node' ||
                parts.slice(1).some(a => !/^[a-zA-Z0-9_.\/-]+$/.test(a)))
              throw new Error('Unexpected legacy regression command: '+command);
            console.log('> '+command);
            execFileSync('node', parts.slice(1), {stdio:'inherit'});
          }
          console.log('PASS: '+commands.length+' legacy Node syntax + gameplay tests');
          NODE
      - name: Verify approved V97 ground defaults and explicit old-mode rollback
        run: node tests/approved-ground-default.js
      - name: Block unreviewed animation wrapper registrations
        run: node tests/animation-ownership-contract.js
      - name: Preserve V100 multi-controller airborne ownership
        run: node tests/v100-single-pose-authority.js
      - name: Check V116 forward whole-leg geometry across mirrored VRM rigs
        run: node tests/v116-standing-jump-geometry.js
      - name: Check V117 forward upper-body geometry across mirrored VRM rigs
        run: node tests/v117-forward-torso-geometry.js
      - name: Inspect ACTUAL Kairo GLB humanoid facing, not a synthetic rig
        run: node tests/v118-real-kairo-orientation.js
      - name: Check V119 native toe and outward foot articulation under true VRM0 facing
        run: node tests/v119-natural-jump-spring.js
      - name: Verify V120 world-space compact arm recoil and ascent at 30/60/120 fps
        run: node tests/v120-jump-arm-geometry.js
      - name: Verify V121 real-world thigh and shoe direction survives first push-off
        run: node tests/v121-takeoff-leg-direction.js
      - name: Verify V122 actually visible toe angle across real VRM0 headings
        run: node tests/v122-visible-foot-heading.js
      - name: Verify V123 expressive prep, push-off, chest/arms/leg rise and protected fall
        run: node tests/v123-expressive-full-jump.js
      - name: Verify V124 real idle foot anchors survive first crouch frame
        run: node tests/v124-idle-foot-continuity.js
      - name: Preserve V115 knee geometry and model axis behavior
        run: node tests/v115-forward-knee-calibration.js
