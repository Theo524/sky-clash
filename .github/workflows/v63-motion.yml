name: V63 Recorded Motion Validation

# Cancel superseded PR workflows without ever hiding main-branch failures.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'js/v63-recorded-motion.js'
      - 'js/v62-playable-master.js'
      - 'src/40-recorded-animations.js'
      - 'src/41-mixamo-animations.js'
      - 'tests/v63-live-motion.js'
      - 'assets/characters/master/anime-kairo.js'
      - 'tests/v65-anime-fighter.js'
      - 'tests/v64-arm-clearance.js'
      - 'tests/v60-master-base.js'
      - 'assets/characters/master/anime-kairo.js'
      - 'tests/v65-anime-fighter.js'
  push:
    branches: [main]
    paths:
      - 'js/v63-recorded-motion.js'
      - 'tests/v63-live-motion.js'
jobs:
  motion-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v60-master-base.js
      - run: node tests/v63-live-motion.js
      - run: node tests/v64-arm-clearance.js
      - run: node tests/v65-anime-fighter.js
