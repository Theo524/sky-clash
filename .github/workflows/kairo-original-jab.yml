name: Kairo Original Jab — Private DCC Blockout
on:
  pull_request:
    paths:
      - 'tools/author-kairo-original-jab.py'
      - 'tools/verify-kairo-original-jab.cjs'
      - '.github/workflows/kairo-original-jab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kairo-jab-private-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-jab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: kairo-official-blender-4.5.15-tarball-x64-v1
      - name: Install hash-verified Blender LTS without apt
        run: |
          set -euo pipefail
          archive="blender-4.5.15-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          if [ ! -s "$archive" ]; then
            curl --fail --location --retry 2 --max-time 360 \
              "https://download.blender.org/release/Blender4.5/$archive" -o "$archive"
          fi
          curl --fail --location --retry 2 --max-time 90 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" -o checksum.txt
          grep " $archive" checksum.txt | sha256sum --check --
          tar -xJf "$archive"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Build original Kairo-joint head IK foot rig
        run: blender --background --factory-startup --python tools/author-kairo-foot-ik.py
      - name: Author one new left jab with real Blender wrist IK targets
        run: |
          blender --background --factory-startup --python tools/author-kairo-original-jab.py
          test -s visual-review-output/kairo-combat-foundation/blender-original-jab-blockout.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: kairo-jab-chromium-1.56.1-x64-v1
      - name: Prepare cached Chromium for REAL Kairo preview
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          node --check tools/verify-kairo-original-jab.cjs
      - name: Start existing game read-only localhost for private WebGL test
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/kairo-jab-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
      - name: Render offline jab poses at 30 60 120fps and review screenshots
        env:
          VISUAL_PORT: '8765'
          KAIRO_PREVIEW_ONLY: '1'
        run: node tools/verify-kairo-original-jab.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-original-jab-blender-private-blockout
          path: |
            visual-review-output/kairo-combat-foundation/blender-original-jab-blockout.json
            visual-review-output/kairo-combat-foundation/kairo-original-jab-review-only.blend
            visual-review-output/kairo-combat-foundation/kairo-jab-private-*.png
            visual-review-output/kairo-combat-foundation/kairo-jab-private-real-webgl-review.json
          retention-days: 21
