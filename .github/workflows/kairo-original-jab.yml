name: Kairo Original Jab — Private DCC and Game Validation
on:
  pull_request:
    paths:
      - 'tools/capture-kairo-combat-anchor.cjs'
      - 'tools/author-kairo-original-jab.py'
      - 'tools/verify-kairo-original-jab.cjs'
      - 'tools/check-kairo-native-jab-gameplay.cjs'
      - 'tests/native-combat-private-preview.js'
      - 'docs/KAIRO-COMBAT-NATIVE-RIG-MANIFEST.v1.json'
      - '.github/workflows/kairo-original-jab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  private-jab-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify media tools before expensive captures
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Check the private combat sampler before expensive authoring
        run: node tests/native-combat-private-preview.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Prepare cached Chromium for the actual game rig
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! node -e "const {chromium}=require('playwright');chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(()=>process.exit(1))"; then
            npx playwright install-deps chromium
          fi
          node --check tools/capture-kairo-combat-anchor.cjs
          node --check tools/verify-kairo-original-jab.cjs
          node --check tools/check-kairo-native-jab-gameplay.cjs
      - name: Serve the unchanged game for private WebGL validation
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/kairo-jab-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:8765/index.html >/dev/null
          curl -fsS --max-time 3 http://127.0.0.1:8765/assets/characters/kairo.vrm >/dev/null
      - name: Capture Kairo's actual game-idle anchor before authoring
        env:
          VISUAL_PORT: '8765'
        run: |
          node tools/capture-kairo-combat-anchor.cjs
          test -s visual-review-output/kairo-combat-foundation/kairo-combat-anchor.json
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: kairo-official-blender-4.5.15-tarball-x64-v1
      - name: Install checksum-verified official Blender LTS
        run: |
          set -euo pipefail
          archive="blender-4.5.15-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          if [ ! -s "$archive" ]; then
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 360 \
              "https://download.blender.org/release/Blender4.5/$archive" -o "$archive"
          fi
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" -o checksum.txt
          grep " $archive" checksum.txt | sha256sum --check --
          tar -xJf "$archive"
          test -x "$RUNNER_TEMP/blender-4.5.15-linux-x64/blender"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Author the original jab from the captured stance
        run: |
          blender --background --factory-startup --python tools/author-kairo-original-jab.py
          test -s visual-review-output/kairo-combat-foundation/blender-original-jab-blockout.json
      - name: Validate calibrated jab and full game replay at 30 60 120fps
        env:
          VISUAL_PORT: '8765'
        run: node tools/verify-kairo-original-jab.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairo-original-jab-private-validation
          path: visual-review-output/kairo-combat-foundation/
          retention-days: 21
          if-no-files-found: error
