name: Kairo Real-VRM Vertical Keyframe Pose Study
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'tools/author-kairo-vertical-keyframes.cjs'
      - '.github/workflows/kairo-vertical-keyframes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-real-kairo-vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Install true-Kairo Pose Lab browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check tools/author-kairo-vertical-keyframes.cjs
      - name: Serve untouched real Kairo VRM and Pose Lab
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/kairo-vertical-keyframe.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/pose-lab.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/assets/characters/kairo.vrm >/dev/null
      - name: Bake and inspect four real-VRM vertical keyframe candidates
        env:
          VISUAL_PORT: '8765'
        run: node tools/author-kairo-vertical-keyframes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kairo-vertical-pose-keyframe-candidates
          path: visual-review-output/kairo-vertical-keyframes/
          retention-days: 21
